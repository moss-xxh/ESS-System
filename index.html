<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>储能柜管理系统 - 登录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background-image: url('./images/封面.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 20px 60px;
            position: relative;
            overflow: hidden;
        }

        /* 深色遮罩层 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
        }

        /* Logo */
        .logo-container {
            position: absolute;
            top: 40px;
            left: 60px;
            z-index: 2;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 左侧欢迎文字 */
        .welcome-text {
            position: absolute;
            left: 60px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            z-index: 2;
            max-width: 600px;
        }

        .welcome-text h1 {
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.2;
            letter-spacing: -1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .welcome-text .subtitle-cn {
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 12px;
            opacity: 0.95;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .welcome-text .subtitle-en {
            font-size: 16px;
            font-weight: 400;
            opacity: 0.8;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* 右侧登录卡片 */
        .login-card {
            width: 420px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
            animation: slideInRight 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .login-card h2 {
            font-size: 24px;
            font-weight: 600;
            color: #1D1D1F;
            margin-bottom: 36px;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #86868B;
            font-size: 18px;
            z-index: 2;
        }

        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 18px 0 52px;
            border: 1.5px solid #E5E5EA;
            border-radius: 12px;
            font-size: 15px;
            color: #1D1D1F;
            background: #F9F9F9;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            background: white;
            border-color: #1890FF;
            box-shadow: 0 0 0 3px rgba(24, 144, 255, 0.1);
        }

        .form-input::placeholder {
            color: #C7C7CC;
        }

        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #86868B;
            cursor: pointer;
            font-size: 18px;
            padding: 8px;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: #1D1D1F;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 28px;
        }

        .forgot-password a {
            color: #1890FF;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .forgot-password a:hover {
            color: #0070E0;
        }

        .btn-login {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, #1890FF 0%, #0070E0 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(24, 144, 255, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(24, 144, 255, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .copyright {
            margin-top: 28px;
            text-align: center;
            font-size: 11px;
            color: #C7C7CC;
        }

        .alert-message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-message.show {
            display: block;
        }

        .alert-danger {
            background: rgba(255, 77, 79, 0.1);
            color: #FF4D4F;
            border: 1px solid rgba(255, 77, 79, 0.2);
        }

        .alert-success {
            background: rgba(82, 196, 26, 0.1);
            color: #52C41A;
            border: 1px solid rgba(82, 196, 26, 0.2);
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            body {
                justify-content: center;
                padding: 20px;
            }

            .welcome-text {
                display: none;
            }

            .logo-container {
                left: 50%;
                transform: translateX(-50%);
                top: 30px;
            }

            .login-card {
                margin-top: 140px;
            }
        }

        @media (max-width: 576px) {
            .logo-container {
                top: 20px;
            }

            .logo {
                width: 60px;
                height: 60px;
            }

            .login-card {
                width: 100%;
                max-width: 380px;
                padding: 36px 28px;
                margin-top: 110px;
            }

            .login-card h2 {
                font-size: 22px;
            }
        }

        .spinner-border-sm {
            width: 1.2rem;
            height: 1.2rem;
            border-width: 0.15em;
        }

        /* 语言切换按钮 */
        .language-switcher {
            position: absolute;
            top: 40px;
            right: 60px;
            z-index: 3;
        }

        .language-switcher .btn {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            color: #1D1D1F;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08),
                        0 1px 3px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .language-switcher .btn i {
            font-size: 16px;
            color: #007AFF;
        }

        .language-switcher .btn:hover {
            background: rgba(255, 255, 255, 1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12),
                        0 4px 8px rgba(0, 0, 0, 0.08);
        }

        .language-switcher .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .language-switcher .btn::after {
            border-top-color: #86868B;
            transition: transform 0.2s;
        }

        .language-switcher .btn:hover::after {
            border-top-color: #1D1D1F;
        }

        .language-switcher .dropdown-menu {
            min-width: 140px;
            margin-top: 8px;
            padding: 6px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15),
                        0 4px 12px rgba(0, 0, 0, 0.1);
            animation: dropdownFade 0.2s ease;
        }

        @keyframes dropdownFade {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .language-switcher .dropdown-item {
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 500;
            color: #1D1D1F;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .language-switcher .dropdown-item:hover {
            background: rgba(0, 122, 255, 0.1);
            color: #007AFF;
        }

        .language-switcher .dropdown-item:active {
            background: rgba(0, 122, 255, 0.15);
            transform: scale(0.98);
        }

        @media (max-width: 1200px) {
            .language-switcher {
                top: 30px;
                right: 20px;
            }
        }

        @media (max-width: 576px) {
            .language-switcher {
                top: 20px;
                right: 15px;
            }

            .language-switcher .btn {
                padding: 8px 14px;
                font-size: 13px;
                border-radius: 10px;
            }

            .language-switcher .btn i {
                font-size: 15px;
            }

            .language-switcher .dropdown-menu {
                min-width: 120px;
            }

            .language-switcher .dropdown-item {
                padding: 8px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- 语言切换按钮 -->
    <div class="language-switcher">
        <div class="dropdown">
            <button class="btn dropdown-toggle" type="button" id="languageDropdown" data-bs-toggle="dropdown">
                <i class="bi bi-translate"></i> <span id="currentLanguage">中文</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" data-lang="zh-CN">简体中文</a></li>
                <li><a class="dropdown-item" href="#" data-lang="en-US">English</a></li>
            </ul>
        </div>
    </div>

    <!-- Logo -->
    <div class="logo-container">
        <div class="logo">
            <img src="./images/logo.png" alt="Logo">
        </div>
    </div>

    <!-- 左侧欢迎文字 -->
    <div class="welcome-text">
        <h1>Hi, <span data-i18n="login.greeting">你好</span>！</h1>
        <div class="subtitle-cn" data-i18n="login.welcome">欢迎进入储能柜管理后台</div>
        <div class="subtitle-en" data-i18n="login.subtitle">Welcome to the Energy Storage Cabinet Management System</div>
    </div>

    <!-- 右侧登录卡片 -->
    <div class="login-card">
        <h2 data-i18n="login.signIn">用户登录</h2>

        <div id="alertContainer"></div>

        <form id="loginForm">
            <div class="input-group-custom">
                <i class="bi bi-phone input-icon"></i>
                <input type="text"
                       class="form-input"
                       id="username"
                       data-i18n="login.username"
                       placeholder="13766477309"
                       value="admin"
                       required>
            </div>

            <div class="input-group-custom">
                <i class="bi bi-lock input-icon"></i>
                <input type="password"
                       class="form-input"
                       id="password"
                       data-i18n="login.password"
                       placeholder="********"
                       value="123456"
                       required>
                <button type="button" class="password-toggle" id="togglePassword">
                    <i class="bi bi-eye-slash"></i>
                </button>
            </div>

            <button type="submit" class="btn-login" id="loginBtn" style="margin-top: 28px;" data-i18n="login.loginButton">
                登录
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/i18n.js"></script>
    <script src="./js/auth.js"></script>
    <script>
        // 初始化i18n
        document.addEventListener('DOMContentLoaded', async function() {
            await i18n.init();

            // 更新语言显示
            updateLanguageDisplay();

            // 语言切换事件
            document.querySelectorAll('[data-lang]').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    const lang = this.getAttribute('data-lang');
                    i18n.setLanguage(lang);
                    updateLanguageDisplay();
                });
            });
        });

        // 更新语言显示
        function updateLanguageDisplay() {
            const currentLang = i18n.getCurrentLanguage();
            const langNames = {
                'zh-CN': '中文',
                'en-US': 'English'
            };
            document.getElementById('currentLanguage').textContent = langNames[currentLang];
        }

        // 密码显示/隐藏
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            }
        });

        // 显示提示信息
        function showAlert(message, type = 'danger') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert-message alert-${type} show">
                    <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-circle'}-fill me-2"></i>
                    ${message}
                </div>
            `;

            setTimeout(() => {
                const alert = alertContainer.querySelector('.alert-message');
                if (alert) {
                    alert.classList.remove('show');
                    setTimeout(() => {
                        alertContainer.innerHTML = '';
                    }, 300);
                }
            }, 3000);
        }

        // 登录表单处理
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            // 表单验证
            if (!username || !password) {
                showAlert(i18n.t('login.error.emptyFields'), 'danger');
                return;
            }

            // 显示加载状态
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>' + i18n.t('login.loggingIn');

            // 模拟登录延迟
            setTimeout(() => {
                const result = Auth.login(username, password, false);

                if (result.success) {
                    showAlert(i18n.t('login.success'), 'success');
                    setTimeout(() => {
                        window.location.href = './dashboard.html';
                    }, 1000);
                } else {
                    showAlert(i18n.t('login.error.invalidCredentials'), 'danger');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = i18n.t('login.loginButton');
                }
            }, 800);
        });

        // 回车提交
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
