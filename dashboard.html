<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="dashboard.title">储能柜管理系统 - 控制台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./css/version-apple.css">
    <link rel="stylesheet" href="./css/modal-apple.css">
    <link rel="stylesheet" href="./css/menu-tree.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <!-- Logo区域 - 固定宽度与侧边栏对齐 -->
        <div class="navbar-logo-section">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="./images/logo.png" alt="AlwaysControl Technology">
            </a>
        </div>

        <!-- 右侧内容区域 -->
        <div class="navbar-content-section">
            <div class="d-flex align-items-center ms-auto">
                <!-- 语言切换 -->
                <div class="dropdown me-3">
                    <button class="btn btn-light btn-sm dropdown-toggle" type="button" id="languageDropdown" data-bs-toggle="dropdown">
                        <i class="bi bi-translate"></i> <span id="currentLanguage">中文</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#" data-lang="zh-CN">简体中文</a></li>
                        <li><a class="dropdown-item" href="#" data-lang="en-US">English</a></li>
                    </ul>
                </div>

                <!-- 用户信息 -->
                <div class="dropdown">
                    <button class="btn btn-light dropdown-toggle d-flex align-items-center" type="button" id="userDropdown" data-bs-toggle="dropdown">
                        <div class="avatar-circle me-2">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <span id="currentUser">Admin</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#/system/password"><i class="bi bi-key me-2"></i><span data-i18n="menu.changePassword">修改密码</span></a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i><span data-i18n="menu.logout">退出登录</span></a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <nav class="sidebar-nav">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="#/customer">
                            <i class="bi bi-people"></i>
                            <span data-i18n="menu.customer">客户管理</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#/version">
                            <i class="bi bi-tags"></i>
                            <span data-i18n="menu.version">版本管理</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#/menu/config">
                            <i class="bi bi-list-check"></i>
                            <span data-i18n="menu.menuConfig">菜单配置</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content" id="mainContent">
        <div class="container-fluid">
            <div id="pageContent">
                <!-- 页面内容将通过路由动态加载 -->
            </div>
        </div>
    </main>

    <!-- 加载动画 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- 右侧弹窗 -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <h5 class="drawer-title" id="drawerTitle">客户详情</h5>
            <button class="btn-close" onclick="Router.closeDrawer()"></button>
        </div>
        <div class="drawer-body" id="drawerBody">
            <!-- 内容将动态加载 -->
        </div>
        <div class="drawer-footer" id="drawerFooter" style="display: none;">
            <!-- 按钮将动态加载 -->
        </div>
    </div>

    <!-- 退出登录确认模态框 - Apple HIG风格 -->
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border: none; border-radius: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 10px 30px rgba(0, 0, 0, 0.1); overflow: hidden;">
                <!-- Modal Header -->
                <div class="modal-header" style="padding: 24px 32px; border-bottom: 1px solid rgba(0, 0, 0, 0.06); background: #FFFFFF;">
                    <h5 class="modal-title" id="logoutModalLabel" style="font-size: 20px; font-weight: 600; color: #1D1D1F; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px;">
                        <i class="bi bi-exclamation-triangle-fill" style="color: #FF9500; font-size: 24px;"></i>
                        确认退出
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="opacity: 0.5;"></button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body" style="padding: 24px 32px; background: #FFFFFF;">
                    <p style="font-size: 15px; color: #1D1D1F; margin-bottom: 8px; line-height: 1.5;">
                        确定要退出登录吗？
                    </p>
                    <p style="font-size: 13px; color: #86868B; margin: 0; line-height: 1.5;">
                        退出后需要重新登录才能访问系统。
                    </p>
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer" style="padding: 20px 32px; border-top: 1px solid rgba(0, 0, 0, 0.06); background: #FFFFFF; gap: 12px; justify-content: flex-end;">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                            style="padding: 10px 24px; border-radius: 10px; font-size: 15px; font-weight: 500; background: #F5F5F7; color: #1D1D1F; border: 1px solid rgba(0, 0, 0, 0.06); transition: all 0.2s;"
                            onmouseover="this.style.background='#E8E8ED'; this.style.transform='translateY(-1px)';"
                            onmouseout="this.style.background='#F5F5F7'; this.style.transform='translateY(0)';">
                        取消
                    </button>
                    <button type="button"
                            class="btn btn-danger"
                            id="confirmLogoutBtn"
                            style="padding: 10px 24px; border-radius: 10px; font-size: 15px; font-weight: 500; background: #FF3B30; color: #FFFFFF; border: none; transition: all 0.2s;"
                            onmouseover="this.style.background='#D52E23'; this.style.transform='translateY(-1px)'; this.style.boxShadow='0 4px 12px rgba(255, 59, 48, 0.3)';"
                            onmouseout="this.style.background='#FF3B30'; this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                        <i class="bi bi-box-arrow-right me-1"></i>退出登录
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 版本编辑模态框 -->
    <div class="modal fade" id="editionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editionModalTitle" data-i18n="version.edit">编辑版本</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul class="nav nav-tabs" id="editionTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="basic-tab" data-bs-toggle="tab" data-bs-target="#basic-pane" type="button" role="tab">
                                <i class="bi bi-info-circle me-1"></i><span data-i18n="version.basicInfo">基础信息</span>
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="feature-tab" data-bs-toggle="tab" data-bs-target="#feature-pane" type="button" role="tab">
                                <i class="bi bi-gear me-1"></i><span data-i18n="version.systemFeatures">系统功能</span>
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="storage-tab" data-bs-toggle="tab" data-bs-target="#storage-pane" type="button" role="tab">
                                <i class="bi bi-gear-fill me-1"></i><span data-i18n="version.otherSettings">其他设置</span>
                            </button>
                        </li>
                    </ul>
                    <div class="tab-content pt-3" id="editionTabContent">
                        <!-- 基础信息 -->
                        <div class="tab-pane fade show active" id="basic-pane" role="tabpanel">
                            <div id="basicContent"></div>
                        </div>
                        <!-- 系统功能 -->
                        <div class="tab-pane fade" id="feature-pane" role="tabpanel">
                            <div id="featureContent"></div>
                        </div>
                        <!-- 数据存储 -->
                        <div class="tab-pane fade" id="storage-pane" role="tabpanel">
                            <div id="storageContent"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="common.cancel">取消</button>
                    <button type="button" class="btn btn-primary" id="saveEditionBtn" data-i18n="common.save">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 通用确认对话框 - Apple HIG风格 -->
    <div class="modal fade" id="confirmDialog" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border: none; border-radius: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 10px 30px rgba(0, 0, 0, 0.1); overflow: hidden;">
                <!-- Modal Header -->
                <div class="modal-header" style="padding: 24px 32px; border-bottom: 1px solid rgba(0, 0, 0, 0.06); background: #FFFFFF;">
                    <h5 class="modal-title" id="confirmDialogTitle" style="font-size: 20px; font-weight: 600; color: #1D1D1F; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px;">
                        <i class="bi bi-exclamation-triangle-fill" style="color: #FF9500; font-size: 24px;"></i>
                        <span id="confirmDialogTitleText">确认操作</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="opacity: 0.5;"></button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body" style="padding: 24px 32px; background: #FFFFFF;">
                    <p id="confirmDialogMessage" style="font-size: 15px; color: #1D1D1F; margin: 0; line-height: 1.5;">
                        <!-- 消息内容将动态设置 -->
                    </p>
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer" style="padding: 20px 32px; border-top: 1px solid rgba(0, 0, 0, 0.06); background: #FFFFFF; gap: 12px; justify-content: flex-end;">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                            style="padding: 10px 24px; border-radius: 10px; font-size: 15px; font-weight: 500; background: #F5F5F7; color: #1D1D1F; border: 1px solid rgba(0, 0, 0, 0.06); transition: all 0.2s;"
                            onmouseover="this.style.background='#E8E8ED'; this.style.transform='translateY(-1px)';"
                            onmouseout="this.style.background='#F5F5F7'; this.style.transform='translateY(0)';">
                        <span id="confirmDialogCancelText">取消</span>
                    </button>
                    <button type="button"
                            class="btn"
                            id="confirmDialogConfirmBtn"
                            style="padding: 10px 24px; border-radius: 10px; font-size: 15px; font-weight: 500; background: #007AFF; color: #FFFFFF; border: none; transition: all 0.2s;"
                            onmouseover="this.style.background='#0051D5'; this.style.transform='translateY(-1px)'; this.style.boxShadow='0 4px 12px rgba(0, 122, 255, 0.3)';"
                            onmouseout="this.style.background='#007AFF'; this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                        <span id="confirmDialogConfirmText">确定</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="./js/i18n.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/api-mock.js"></script>
    <script src="./js/router.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
